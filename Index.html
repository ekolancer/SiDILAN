<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiDILAN - Sistem Digital Monitoring Tindak Lanjut Surat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen overflow-hidden flex flex-col">

<!-- VIEW: LOGIN -->
<div id="loginView" class="h-screen w-full flex items-center justify-center bg-gradient-to-br from-blue-900 to-blue-700 fade-in absolute z-50">
    <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-900 mb-2">SiDILAN</h1>
            <p class="text-sm text-gray-500">Sistem Digital Monitoring Tindak Lanjut Surat</p>
        </div>
        
        <div id="accessStatus" role="status" aria-live="polite" class="mb-4 p-4 bg-blue-50 text-blue-900 rounded-lg text-sm">
            Memeriksa akses akun Google...
        </div>
        <p id="accessIdentity" class="hidden mb-4 text-sm text-gray-600"></p>
        <button id="retryAccess" type="button" onclick="initializeAppStatus()" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition-colors">
            Coba lagi
        </button>
        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026 SiDILAN. All rights reserved.
        </div>
    </div>
</div>

<!-- VIEW: REGISTER -->
<div id="mainView" class="hidden min-h-screen w-full bg-gray-50">
    <header class="bg-white border-b border-gray-200 px-4 py-4 sm:px-6">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4">
            <h2 class="text-xl font-bold text-blue-900">SiDILAN <span class="font-normal text-gray-500">/ Surat Masuk</span></h2>
            <span id="userRoleDisplay" class="text-sm text-gray-600"></span>
        </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
        <p id="userNameDisplay" class="mb-4 text-sm text-gray-600"></p>
        <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-6">
            <h1 class="text-2xl font-semibold text-gray-900">Daftar surat masuk</h1>
            <form id="searchForm" class="mt-5 grid gap-3 sm:grid-cols-[1fr_auto]" role="search">
                <label class="sr-only" for="keyword">Kata kunci pencarian</label>
                <input id="keyword" maxlength="200" class="min-w-0 rounded-lg border border-gray-300 px-3 py-2" placeholder="Cari agenda, nomor surat, asal, atau perihal" autocomplete="off">
                <button class="rounded-lg bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800" type="submit">Cari</button>
            </form>
            <div class="mt-3 flex flex-wrap items-center gap-3">
                <label for="positions" class="text-sm font-medium">Posisi surat</label>
                <select id="positions" multiple size="1" aria-label="Filter posisi surat" class="max-w-full rounded-lg border border-gray-300 px-2 py-2"></select>
                <button id="resetSearch" type="button" class="text-sm text-blue-700 underline">Reset</button>
                <button id="reload" type="button" class="text-sm text-blue-700 underline">Muat ulang</button>
            </div>
            <p id="listStatus" role="status" aria-live="polite" class="mt-4 text-sm text-gray-600">Masukkan kata kunci pencarian.</p>
            <p id="warningStatus" class="hidden mt-2 text-sm text-amber-800"></p>
            <div id="recordList" class="mt-4 divide-y divide-gray-200"></div>
            <nav id="pagination" aria-label="Paginasi daftar surat" class="hidden mt-5 flex items-center justify-between gap-3">
                <button id="previousPage" type="button" class="rounded border px-3 py-2 disabled:opacity-40">Sebelumnya</button>
                <span id="pageStatus" class="text-sm text-gray-600"></span>
                <button id="nextPage" type="button" class="rounded border px-3 py-2 disabled:opacity-40">Berikutnya</button>
            </nav>
        </section>
        <section id="detailPanel" aria-labelledby="detailTitle" class="hidden mt-5 rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-6" tabindex="-1">
            <div class="flex items-start justify-between gap-3">
                <div><h2 id="detailTitle" class="text-xl font-semibold"></h2><p id="detailAgenda" class="mt-1 text-sm text-gray-600"></p></div>
                <button id="closeDetail" type="button" class="rounded border px-3 py-2">Tutup</button>
            </div>
            <dl id="detailFields" class="mt-5 grid gap-4 sm:grid-cols-2"></dl>
        </section>
    </main>
</div>

<script>
    let statusRequestPending = false;
    let listState = { keyword: '', positions: undefined, page: 1, pageCount: 1 };

    function runGoogleScript(funcName, ...args) {
        return new Promise((resolve, reject) => {
            if (typeof google === 'undefined' || !google.script || !google.script.run) {
                reject(new Error('APPS_SCRIPT_UNAVAILABLE'));
                return;
            }
            google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                [funcName](...args);
        });
    }

    const fieldLabels = {
        receivedDate: 'Tanggal diterima', letterNumber: 'Nomor surat', letterDate: 'Tanggal surat', sender: 'Asal surat',
        subject: 'Perihal', documentDescription: 'Uraian berkas', disposition: 'Isi disposisi',
        dispositionTargets: 'Tujuan disposisi', parafDateOrNote: 'Keterangan / tanggal paraf',
        letterPosition: 'Posisi surat', followupNote: 'Keterangan tindak lanjut'
    };

    function selectedPositions() {
        const select = document.getElementById('positions');
        return [...select.selectedOptions].map(option => option.value);
    }

    function renderPositions(positions) {
        const select = document.getElementById('positions');
        const previous = new Set(selectedPositions());
        select.replaceChildren();
        positions.forEach(position => {
            const option = document.createElement('option');
            option.value = position;
            option.textContent = position || 'Belum diisi';
            option.selected = listState.positions === undefined || previous.has(position);
            select.append(option);
        });
        if (listState.positions !== undefined) {
            [...select.options].forEach(option => { option.selected = listState.positions.includes(option.value); });
        }
    }

    function renderRecord(record) {
        const article = document.createElement('article');
        article.className = 'grid gap-2 py-4 sm:grid-cols-[1fr_auto] sm:items-center';
        const summary = document.createElement('div');
        const title = document.createElement('h3');
        title.className = 'font-semibold text-gray-900';
        title.textContent = `${record.agenda || 'Belum diisi'} · ${record.subject || 'Belum diisi'}`;
        const subline = document.createElement('p');
        subline.className = 'mt-1 text-sm text-gray-600';
        subline.textContent = [record.receivedDate || 'Belum diisi', record.letterNumber || 'Belum diisi', record.sender || 'Belum diisi', record.letterPosition || 'Belum diisi'].join(' · ');
        summary.append(title, subline);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'justify-self-start rounded border border-blue-700 px-3 py-2 text-sm text-blue-800';
        button.textContent = 'Lihat detail';
        button.addEventListener('click', () => loadDetail(record));
        article.append(summary, button);
        return article;
    }

    function loadRecords() {
        const status = document.getElementById('listStatus');
        const list = document.getElementById('recordList');
        const pager = document.getElementById('pagination');
        status.textContent = 'Memuat daftar...';
        list.replaceChildren();
        pager.classList.add('hidden');
        runGoogleScript('getSuratMasuk', { keyword: listState.keyword, positions: listState.positions, page: listState.page })
            .then(result => {
                if (!result || !result.success) {
                    status.textContent = result && result.message || 'Daftar surat tidak dapat dimuat.';
                    return;
                }
                renderPositions(result.positions || []);
                listState.page = result.page;
                listState.pageCount = Math.max(1, Math.ceil(result.total / result.pageSize));
                result.records.forEach(record => list.append(renderRecord(record)));
                status.textContent = result.total ? `${result.total} pencatatan ditemukan.` : 'Tidak ada data yang cocok.';
                const warning = document.getElementById('warningStatus');
                warning.textContent = result.warningCount ? `${result.warningCount} baris dilewati karena data tidak dapat dibaca.` : '';
                warning.classList.toggle('hidden', !result.warningCount);
                document.getElementById('pageStatus').textContent = `Halaman ${listState.page} dari ${listState.pageCount}`;
                document.getElementById('previousPage').disabled = listState.page <= 1;
                document.getElementById('nextPage').disabled = listState.page >= listState.pageCount;
                pager.classList.toggle('hidden', !result.total);
            })
            .catch(() => { status.textContent = 'Daftar surat gagal dimuat. Periksa koneksi lalu coba lagi.'; });
    }

    function loadDetail(reference) {
        const panel = document.getElementById('detailPanel');
        document.getElementById('detailTitle').textContent = 'Memuat detail...';
        document.getElementById('detailAgenda').textContent = '';
        document.getElementById('detailFields').replaceChildren();
        panel.classList.remove('hidden');
        runGoogleScript('getSuratDetail', { rowHint: reference.rowHint, agenda: reference.agenda, expectedHash: reference.expectedHash })
            .then(result => {
                if (!result || !result.success) {
                    document.getElementById('detailTitle').textContent = result && result.message || 'Detail surat tidak dapat dimuat.';
                    return;
                }
                const record = result.record;
                document.getElementById('detailTitle').textContent = record.subject || 'Perihal belum diisi';
                document.getElementById('detailAgenda').textContent = `Nomor agenda: ${record.agenda || 'Belum diisi'}`;
                const fields = document.getElementById('detailFields');
                Object.entries(fieldLabels).forEach(([key, label]) => {
                    const wrapper = document.createElement('div');
                    const term = document.createElement('dt');
                    term.className = 'text-sm font-semibold text-gray-700';
                    term.textContent = label;
                    const value = document.createElement('dd');
                    value.className = 'mt-1 whitespace-pre-wrap break-words text-sm text-gray-800';
                    value.textContent = record[key] || 'Belum diisi';
                    wrapper.append(term, value);
                    fields.append(wrapper);
                });
                [['letterFileReference', 'Berkas surat'], ['followupReference', 'Berkas / catatan tindak lanjut']].forEach(([key, label]) => {
                    const wrapper = document.createElement('div');
                    const term = document.createElement('dt');
                    term.className = 'text-sm font-semibold text-gray-700';
                    term.textContent = label;
                    const value = document.createElement('dd');
                    value.className = 'mt-1 text-sm';
                    const links = record.links && record.links[key] || [];
                    if (links.length) links.forEach(link => {
                        const anchor = document.createElement('a');
                        anchor.href = link.url;
                        anchor.target = '_blank';
                        anchor.rel = 'noopener noreferrer';
                        anchor.className = 'mr-3 text-blue-700 underline';
                        anchor.textContent = link.label || link.url;
                        value.append(anchor);
                    });
                    else value.textContent = record[key] || 'Belum diisi';
                    wrapper.append(term, value);
                    fields.append(wrapper);
                });
                panel.focus();
            })
            .catch(() => { document.getElementById('detailTitle').textContent = 'Detail surat gagal dimuat. Coba muat ulang daftar.'; });
    }

    function loadInitialRegister() {
        document.getElementById('listStatus').textContent = 'Masukkan kata kunci pencarian.';
        runGoogleScript('getInitialData')
            .then(result => {
                if (!result || !result.success) {
                    document.getElementById('listStatus').textContent = result && result.message || 'Data awal tidak dapat dimuat.';
                    return;
                }
                renderPositions(result.positions || []);
                document.getElementById('warningStatus').textContent = '';
                if (result.warningCount) {
                    const warning = document.getElementById('warningStatus');
                    warning.textContent = `${result.warningCount} baris dilewati karena data tidak dapat dibaca.`;
                    warning.classList.remove('hidden');
                }
            })
            .catch(() => { document.getElementById('listStatus').textContent = 'Data awal gagal dimuat. Periksa koneksi lalu coba lagi.'; });
    }

    function initializeAppStatus() {
        if (statusRequestPending) return;
        statusRequestPending = true;
        const status = document.getElementById('accessStatus');
        const retry = document.getElementById('retryAccess');
        const identity = document.getElementById('accessIdentity');
        const main = document.getElementById('mainView');
        const login = document.getElementById('loginView');
        retry.classList.add('hidden');
        status.className = 'mb-4 rounded-lg bg-blue-50 p-4 text-sm text-blue-900';
        status.textContent = 'Memeriksa akses akun Google...';

        runGoogleScript('getAppStatus')
            .then(result => {
                if (!result || !result.success) {
                    status.className = 'mb-4 rounded-lg bg-red-50 p-4 text-sm text-red-800';
                    status.textContent = result && result.message || 'Status akses tidak dapat diverifikasi.';
                    retry.classList.remove('hidden');
                    return;
                }
                document.getElementById('userNameDisplay').textContent = result.email;
                document.getElementById('userRoleDisplay').textContent = result.role === 'WRITE' ? 'Pencatat' : 'Pembaca';
                identity.textContent = result.email;
                login.classList.add('hidden');
                main.classList.remove('hidden');
                loadInitialRegister();
            })
            .catch(() => {
                status.className = 'mb-4 rounded-lg bg-red-50 p-4 text-sm text-red-800';
                status.textContent = 'Status akses gagal diperiksa. Pastikan aplikasi dibuka melalui deployment Google Apps Script.';
                retry.classList.remove('hidden');
            })
            .finally(() => { statusRequestPending = false; });
    }

    document.getElementById('searchForm').addEventListener('submit', event => {
        event.preventDefault();
        listState.keyword = document.getElementById('keyword').value.trim();
        listState.positions = selectedPositions();
        listState.page = 1;
        if (!listState.keyword) {
            document.getElementById('listStatus').textContent = 'Masukkan kata kunci pencarian.';
            document.getElementById('recordList').replaceChildren();
            document.getElementById('pagination').classList.add('hidden');
            return;
        }
        loadRecords();
    });
    document.getElementById('resetSearch').addEventListener('click', () => {
        document.getElementById('keyword').value = '';
        listState = { keyword: '', positions: undefined, page: 1, pageCount: 1 };
        renderPositions([...document.getElementById('positions').options].map(option => option.value));
        document.getElementById('recordList').replaceChildren();
        document.getElementById('listStatus').textContent = 'Masukkan kata kunci pencarian.';
        document.getElementById('pagination').classList.add('hidden');
    });
    document.getElementById('reload').addEventListener('click', () => { if (listState.keyword) loadRecords(); else loadInitialRegister(); });
    document.getElementById('previousPage').addEventListener('click', () => { if (listState.page > 1) { listState.page--; loadRecords(); } });
    document.getElementById('nextPage').addEventListener('click', () => { if (listState.page < listState.pageCount) { listState.page++; loadRecords(); } });
    document.getElementById('closeDetail').addEventListener('click', () => {
        document.getElementById('detailPanel').classList.add('hidden');
        document.getElementById('recordList').querySelector('button')?.focus();
    });

    document.addEventListener('DOMContentLoaded', initializeAppStatus);
</script>

</body>
</html>
