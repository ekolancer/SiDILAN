name: Deploy to Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Authenticate clasp
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON kosong / belum diset!"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "Credentials tersimpan. Cek struktur (tanpa bocorkan token):"
          node -e "const c=require(process.env.HOME+'/.clasprc.json'); const k=Object.keys(c.tokens||{}); console.log('token keys:', k); console.log('has refresh_token:', !!c.tokens?.[k[0]]?.refresh_token);"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Create version & deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          VERSION_DESC="Deploy from GitHub ${GITHUB_SHA:0:7} by ${GITHUB_ACTOR}"
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "Deploying ke deployment ID: $DEPLOYMENT_ID"
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$VERSION_DESC"
          else
            echo "DEPLOYMENT_ID kosong, membuat deployment baru..."
            clasp deploy --description "$VERSION_DESC"
          fi
