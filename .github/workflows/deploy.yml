name: Deploy to Apps Script

permissions:
  contents: read

concurrency:
  group: apps-script-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build and test frontend
        run: |
          npm test
          npm run test:build

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Authenticate clasp
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON kosong / belum diset!"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Check deployment target
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Secret DEPLOYMENT_ID wajib diisi agar workflow memperbarui deployment tetap."
            exit 1
          fi
          clasp status

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Create version & deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          VERSION_DESC="Deploy from GitHub ${GITHUB_SHA:0:7} by ${GITHUB_ACTOR}"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$VERSION_DESC"
